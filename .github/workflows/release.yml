name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test --package-path Packages/OpenHereCore

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build (ad-hoc signed) and package
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          export BUILD_NUMBER="${{ github.run_number }}"
          scripts/build_release.sh

      - name: Sign for Sparkle and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/make_appcast.sh "build/release/OpenHere-$VERSION.dmg" "$RUNNER_TEMP/appcast.xml"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The release notes are the matching section of CHANGELOG.md ("## <version>").
          awk -v v="$VERSION" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no '## $VERSION' section" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "build/release/OpenHere-$VERSION.dmg" "build/release/OpenHere-$VERSION.dmg.sha256" \
            --title "OpenHere $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish the appcast (GitHub Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p site/public
          cp "$RUNNER_TEMP/appcast.xml" site/public/appcast.xml
          git add site/public/appcast.xml
          git commit -m "Appcast for ${GITHUB_REF_NAME}"
          git push origin main
