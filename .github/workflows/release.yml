name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the build number is the commit count

      - name: Validate the tag
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Tag '$GITHUB_REF_NAME' is not a version tag (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test --package-path Packages/OpenHereCore

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build (ad-hoc signed) and package
        run: |
          # Version = tag; build number = commit count (see scripts/build_release.sh).
          export VERSION="${GITHUB_REF_NAME#v}"
          scripts/build_release.sh

      - name: Sign for Sparkle and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/make_appcast.sh "build/release/OpenHere-$VERSION.dmg" "$RUNNER_TEMP/appcast.xml"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The release notes are the matching section of CHANGELOG.md ("## <version>").
          awk -v v="$VERSION" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no '## $VERSION' section" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "build/release/OpenHere-$VERSION.dmg" "build/release/OpenHere-$VERSION.dmg.sha256" \
            --title "OpenHere $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish the appcast and sync the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p site/public
          cp "$RUNNER_TEMP/appcast.xml" site/public/appcast.xml
          # Keep the project's version in step with the release so local builds report it.
          sed -i '' -E "s/^MARKETING_VERSION = .*/MARKETING_VERSION = $VERSION/" Config/Base.xcconfig
          git add site/public/appcast.xml Config/Base.xcconfig
          git commit -m "chore(release): ${VERSION}" -m "Update the appcast and MARKETING_VERSION for ${GITHUB_REF_NAME}."
          git push origin main

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy the site explicitly.
      - name: Deploy the site with the new appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
